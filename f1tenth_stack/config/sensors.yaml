gl_ros_driver_udp_node:
  ros__parameters:
    gl_ip: "10.110.1.2"
    gl_port: 2000
    pc_port: 3000
    frame_id: "laser"
    pub_topicname_lidar: "scan"
    # GL3는 원래 각도를 [0, 180]도로 발행한다(정면 = 중앙 90도).
    # -90도 오프셋을 주면 스캔이 [-90, +90]도가 되어 정면이 0 rad이 되고
    # laser 좌표계/RViz와도 일치한다.
    # (wall_follow, gap_follow 노드는 시야각 중앙을 정면으로 계산하므로
    #  이 값이 0이어도 주행은 되지만, RViz 확인과 다른 노드 호환을 위해 권장)
    # !! 실차 확인 필수: 차 왼쪽에 물체를 두고 RViz에서 스캔의 +y(왼쪽)에
    #    나타나는지 볼 것. 오른쪽에 나타나면 마운트가 반대이므로 아래 참고.
    angle_offset: -90.0
